<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<!-- Purpose: A1 Agent mobile-first UI, Phase 26 (Dashboard + Market/AI tabs) -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>A1 Agent</title>
<style>
/* Logic: Dark glassmorphism theme, mobile-first, bottom tab bar */
:root{--bg:#0b0e14;--card:#151a24;--acc:#3b82f6;--up:#22c55e;--dn:#ef4444;--tx:#e5e7eb;--mut:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn',system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:70px}
header{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:rgba(11,14,20,.85);backdrop-filter:blur(8px)}
header h1{font-size:1.05rem}
.badge{font-size:.65rem;padding:3px 8px;border-radius:99px;background:#134e4a;color:#5eead4}
.page{padding:16px;display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid #232a38;border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:.85rem;color:var(--mut);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid #232a38;border-radius:14px;padding:12px}
.kpi .v{font-size:1.15rem;font-weight:700;margin-top:4px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1c2330;font-size:.85rem}
.row:last-child{border:none}
.up{color:var(--up)}.dn{color:var(--dn)}
.tabbar{position:fixed;bottom:0;right:0;left:0;display:flex;background:var(--card);border-top:1px solid #232a38}
.tabbar button{flex:1;background:none;border:none;color:var(--mut);padding:12px 0;font-size:.72rem;cursor:pointer}
.tabbar button.active{color:var(--acc)}
button.act{width:100%;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px;font-weight:700;cursor:pointer}
.chatbox{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;font-size:.83rem;line-height:1.7}
.msg.bot{background:var(--card);align-self:flex-start}
.msg.me{background:var(--acc);align-self:flex-end}
.chatin{display:flex;gap:8px}
.chatin input{flex:1;background:#0f1420;border:1px solid #232a38;border-radius:10px;padding:11px;color:var(--tx)}
</style>
</head>
<body>
<header><h1>🤖 A1 Agent</h1><span id="svc-badge" class="badge">● LIVE</span></header>

<!-- ============ TAB 1: DASHBOARD ============ -->
<section id="tab-dash" class="page active">
  <div class="kpis">
    <div class="kpi"><h3>شاخص کل</h3><div class="v" id="k-index">—</div></div>
    <div class="kpi"><h3>ارزش بازار (هم‌وزن)</h3><div class="v" id="k-equal">—</div></div>
  </div>
  <div class="card">
    <h3>دیده‌بان بازار — Snapshot زنده</h3>
    <div id="watchlist">در حال بارگذاری…</div>
  </div>
  <div class="card">
    <h3>وضعیت موتور AI</h3>
    <div id="ai-status">—</div>
    <br><button class="act" onclick="runAnalysis()">اجرای تحلیل بازار با AI</button>
    <div id="ai-result" style="margin-top:10px"></div>
  </div>
</section>

<!-- ============ TAB 2: MARKET / AI ANALYSIS ============ -->
<section id="tab-ai" class="page">
  <div class="card">
    <h3>گفتگو با تحلیلگر AI</h3>
    <div class="chatbox" id="chat">
      <div class="msg bot">سلام! من A1 هستم. آماده دریافت دستورات شما.</div>
    </div>
    <div class="chatin">
      <input id="chat-input" placeholder="پیام شما…">
      <button class="act" style="width:auto;padding:11px 18px" onclick="sendChat()">ارسال</button>
    </div>
  </div>
</section>

<!-- ============ BOTTOM TAB BAR ============ -->
<nav class="tabbar">
  <button class="active" data-tab="tab-dash" onclick="go(this)">📊 داشبورد</button>
  <button data-tab="tab-ai" onclick="go(this)">🧠 تحلیل بازار/AI</button>
</nav>

<script>
/* Purpose: Frontend controller. Logic: calls existing backend contracts only. */
const API='http://127.0.0.1:8000';
const $=id=>document.getElementById(id);

function go(btn){ // Simple hash-free tab router
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.remove('active'));
  $(btn.dataset.tab).classList.add('active'); btn.classList.add('active');
}

async function loadDashboard(){ // Contract: GET /api/v1/market/overview
  try{
    const r=await fetch(API+'/api/v1/market/overview'); const d=await r.json();
    $('k-index').textContent=(d.index_value??d.index??'—');
    $('k-equal').textContent=(d.equal_weighted_index??'—');
    const q=(d.top_movers??d.quotes??[]).slice(0,8);
    $('watchlist').innerHTML=q.map(x=>{
      const chg=x.change_pct??x.changePercent??0, cls=chg>=0?'up':'dn';
      return `<div class="row"><span>${x.symbol??x.name}</span><span class="${cls}">${x.price??x.last_price??'—'} (${chg}%)</span></div>`;
    }).join('')||'داده‌ای موجود نیست';
  }catch(e){$('watchlist').innerHTML='<span class="dn">بک‌اند متصل نیست</span>';}
}

async function loadAIStatus(){ // Contract: GET /api/ai/status
  try{const d=await(await fetch(API+'/api/ai/status')).json();
    $('ai-status').textContent=`مدل: ${d.model} — حالت: ${d.mode}`;}
  catch(e){$('ai-status').textContent='AI آفلاین';}
}

async function runAnalysis(){ // Contract: POST /api/ai/analyze-market
  $('ai-result').textContent='در حال تحلیل…';
  try{const d=await(await fetch(API+'/api/ai/analyze-market',{method:'POST'})).json();
    $('ai-result').innerHTML=`سیگنال: <b class="${d.signal==='HOLD'?'':'up'}">${d.signal??'—'}</b> — ریسک: ${d.risk_score??'—'}`;}
  catch(e){$('ai-result').textContent='خطا در تحلیل';}
}

async function sendChat(){ // Contract: POST /api/ai/chat -> {ok,reply}
  const inp=$('chat-input'), txt=inp.value.trim(); if(!txt)return;
  $('chat').insertAdjacentHTML('beforeend',`<div class="msg me">${txt}</div>`);
  inp.value=''; $('chat').scrollTop=1e6;
  try{const d=await(await fetch(API+'/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:txt})})).json();
    $('chat').insertAdjacentHTML('beforeend',`<div class="msg bot">${d.reply??d.response??'—'}</div>`);}
  catch(e){$('chat').insertAdjacentHTML('beforeend','<div class="msg bot">اتصال برقرار نشد</div>');}
  $('chat').scrollTop=1e6;
}

loadDashboard(); loadAIStatus();
setInterval(loadDashboard,30000); // 30s auto-refresh
</script>
</body>
</html>
